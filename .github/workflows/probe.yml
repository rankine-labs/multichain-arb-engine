# ============================================================================
# LIVE PROBE (manual) -- checks the bot's parsers against the real feeds.
# Run from GitHub: Actions -> "Live probe" -> Run workflow. Results appear
# as an annotation on the run. Never touches the server or any funds.
# ============================================================================
name: Live probe

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run one step only: feeds, sim, pairs, watch, universe, backtest, latency, lenders, smoke, seed, routers, v4, arbsys, nodes, multicall, simv1, ramsessim, routes, venues (blank = all except backtest)'
        required: false
        default: ''

# Read-only token: these jobs only check out code and run tests/probes.
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc -p tsconfig.scripts.json
      - name: Probe live feeds
        if: inputs.only == '' || inputs.only == 'feeds'
        shell: bash
        run: |
          out=$(node .scripts-build/scripts/probe-feeds.js 2>&1 | tail -40)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=Feed probe::${out}"
      - name: Can the node replay trigger-then-ours (eth_simulateV1)
        if: inputs.only == 'simv1'
        shell: bash
        run: |
          out=$(node .scripts-build/scripts/probe-simv1.js 2>&1 | tail -10)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=simulateV1 probe::${out}"
      # Phase 6 research: rival wins by route length (2, 3, 4+ pools) and how
      # they would fare under each way of paying (flash loan fee vs own
      # money). The script writes its own annotations. Read-only.
      - name: Routes and funding study (rival wins, read-only)
        if: inputs.only == 'routes'
        shell: bash
        run: |
          timeout 3300 node .scripts-build/scripts/probe-routes-funding.js || true
      # Extra venues (Oct 8): identify factories, map pools to exchanges and
      # check our pricing maths against real swaps. Writes its own annotations.
      - name: Venue identification and swap-maths validation (read-only)
        if: inputs.only == 'venues'
        shell: bash
        run: |
          timeout 2700 node .scripts-build/scripts/probe-venues.js || true
      - name: Ramses route check on the live node (bot's own simulation + trace)
        if: inputs.only == 'ramsessim'
        shell: bash
        run: |
          out=$(node .scripts-build/scripts/probe-ramses-sim.js 2>&1 | tail -50)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=Ramses sim probe::${out}"
      - name: Probe free simulation on real chains
        if: inputs.only == '' || inputs.only == 'sim'
        shell: bash
        run: |
          out=$(node .scripts-build/scripts/probe-sim.js 2>&1 | tail -20)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=Simulation probe::${out}"
      - name: Robinhood most-traded pairs
        if: inputs.only == '' || inputs.only == 'pairs'
        shell: bash
        run: |
          out=$(PROBE_SECONDS=120 node .scripts-build/scripts/probe-pairs.js 2>&1 | tail -25)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=Pair probe::${out}"
      - name: Robinhood pool discovery (pair watcher)
        if: inputs.only == '' || inputs.only == 'watch'
        shell: bash
        run: |
          out=$(node .scripts-build/scripts/probe-watch.js 2>&1 | tail -20)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=Watch probe::${out}"
      - name: Robinhood chain-wide pool scan (every pair on 2+ pools)
        if: inputs.only == '' || inputs.only == 'universe'
        shell: bash
        run: |
          out=$(timeout 1200 node .scripts-build/scripts/probe-universe.js 2>&1 | tail -40)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=Universe scan::${out}"
      - name: Robinhood backtest (last 7 days of trades)
        if: inputs.only == 'backtest'
        shell: bash
        run: |
          out=$(timeout 5400 node --max-old-space-size=12000 .scripts-build/scripts/backtest-robinhood.js 2>&1 | tail -60 || true)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=Backtest::${out}"
      - name: Latency to Robinhood servers
        if: inputs.only == '' || inputs.only == 'latency'
        shell: bash
        run: |
          out=$(node deploy/latency-check.js 2>&1 | tail -10 || true)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=Latency::${out}"
      # SMOKE RUN: builds dist/ exactly like the server's auto-deploy and runs
      # the real bot in DRY RUN for SMOKE_SECONDS. No .env, no keys, no
      # Telegram (messages just print), so nothing leaves this runner except
      # read-only chain requests. Lets us check a release when the server
      # itself can't be reached.
      - name: Smoke run (real bot, dry run, no keys, no Telegram)
        if: inputs.only == 'smoke'
        shell: bash
        env:
          CHAINS: robinhood
          EXECUTION_ENABLED: 'false'
          SMOKE_SECONDS: '1500'
        run: |
          # No early exit: a search with zero matches must not fail the step.
          set +e +o pipefail
          npm run build
          mkdir -p data
          # Run the bot; keep the full log, it never fails the job on its own.
          timeout "$SMOKE_SECONDS" node dist/shadowMain.js > smoke.log 2>&1 || true
          # Summary: the lines that prove each part works, plus any errors.
          {
            echo "Ran $((SMOKE_SECONDS / 60)) min. Log lines: $(wc -l < smoke.log)"
            echo "--- startup / scan / sender ---"
            grep -E '^\[(startup|scan|fire)\]' smoke.log | head -12
            echo "--- standing gaps found: $(grep -c '^\[gap\] standing gap' smoke.log) (first 8) ---"
            grep '^\[gap\]' smoke.log | head -8
            echo "--- rivals seen: $(grep -c '^\[rival\]' smoke.log) ---"
            echo "--- extra venues: pools by exchange in the watch list ---"
            grep -oE 'dex[=:" ]+(alandale|giga-cl|giga-classic|fables|up-cl|topaz-cl|raphael-cl|swaphood-v3|sushiswap-v3|kittenswap-algebra|goo-exchange)' smoke.log | sort | uniq -c | head -12
            grep -E "exchange we can't trade yet|standing gap needs" smoke.log | head -4
            echo "--- rival watch: $(grep -c '^\[rivalwatch\]' smoke.log) lines; oracle balances: $(grep -c 'real V3 balances read' smoke.log) ---"
            grep -E '^\[oracle\]' smoke.log | head -2
            grep -E '^\[scan\].*(alandale|giga|fables|up-cl)' smoke.log | head -4
            echo "--- errors / crashes ($(grep -ciE 'unhandled|error|fatal' smoke.log)) first 10 ---"
            grep -iE 'unhandled|error|fatal' smoke.log | grep -v 'TELEGRAM_BOT_TOKEN' | head -10
          } > summary.txt
          cat summary.txt
          out=$(cat summary.txt)
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=Smoke run::${out}"
      - name: Keep the full smoke log
        if: always() && inputs.only == 'smoke'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log
      - name: Which routers send swaps the bot can't read
        if: inputs.only == 'routers'
        shell: bash
        run: |
          out=$(timeout 2400 node .scripts-build/scripts/probe-routers.js 2>&1 | tail -30 || true)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=Routers::${out}"
      - name: V4 pools for the watched pairs
        if: inputs.only == 'v4'
        shell: bash
        run: |
          out=$(timeout 1200 node .scripts-build/scripts/probe-v4.js 2>&1 | tail -45 || true)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=V4 pools::${out}"
      - name: ArbSys block number (contract trade deadline)
        if: inputs.only == 'arbsys'
        shell: bash
        run: |
          out=$(timeout 120 node .scripts-build/scripts/probe-arbsys.js 2>&1 | tail -8 || true)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=ArbSys::${out}"
      - name: Free RPC nodes compared
        if: inputs.only == 'nodes'
        shell: bash
        run: |
          out=$(timeout 180 node .scripts-build/scripts/probe-nodes.js 2>&1 | tail -10 || true)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=Nodes::${out}"
      - name: Multicall discovery vs old, balance lookup
        if: inputs.only == 'multicall'
        shell: bash
        run: |
          out=$(timeout 600 node .scripts-build/scripts/probe-multicall.js 2>&1 | tail -14 || true)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=Multicall::${out}"
      - name: Export top pairs (backup list the bot starts from)
        if: inputs.only == 'seed'
        shell: bash
        run: |
          out=$(timeout 2400 node .scripts-build/scripts/export-top-pairs.js 2>&1 | tail -30 || true)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=Top pairs::${out}"
      - name: Suggest flash lenders (for deploying the contract)
        if: inputs.only == 'lenders'
        shell: bash
        run: |
          out=$(timeout 2400 node .scripts-build/scripts/suggest-lenders.js 2>&1 | tail -40 || true)
          echo "$out"
          out="${out//'%'/'%25'}"; out="${out//$'\n'/'%0A'}"
          echo "::notice title=Flash lenders::${out}"
