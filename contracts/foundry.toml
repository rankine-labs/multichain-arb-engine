# Foundry config for the on-chain execution contract.
# Run from this folder:  forge build   /   forge test -vv
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1000000   # contract is called constantly, deployed once: optimise for call cost
evm_version = "shanghai"   # widest support across Avalanche, Monad and Robinhood Chain (no transient storage needed)

# Fork tests only: run on the Cancun EVM, because live contracts we call
# (e.g. Aave V3 on Avalanche) already use Cancun opcodes. The contract you
# DEPLOY is still built with the default profile above (Shanghai).
#   FOUNDRY_PROFILE=fork forge test --match-path test/Fork.t.sol
[profile.fork]
evm_version = "cancun"
