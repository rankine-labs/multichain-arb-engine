# ---------------------------------------------------------------------------
# arbsim: the in-bot simulator sidecar (see DESIGN.md).
# Runs our ArbExecutor contract on an in-memory copy of Robinhood Chain state.
# ---------------------------------------------------------------------------
[package]
name = "arbsim"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "arbsim"
path = "src/main.rs"

[dependencies]
# Same revm build that passed go/no-go #1 (50/50 real trades exact).
revm = { version = "=43.0.3", default-features = false, features = [
    "std", "secp256k1", "portable", "c-kzg", "blst",
    "optional_no_base_fee", "optional_balance_check",
    "optional_block_gas_limit", "optional_eip3607",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
