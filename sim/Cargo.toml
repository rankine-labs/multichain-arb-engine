# ---------------------------------------------------------------------------
# arbsim: the in-bot simulator sidecar (see DESIGN.md).
# Runs our ArbExecutor contract on an in-memory copy of Robinhood Chain state.
# ---------------------------------------------------------------------------
[package]
name = "arbsim"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "arbsim"
path = "src/main.rs"

[dependencies]
# Same revm build that passed go/no-go #1 (50/50 real trades exact).
revm = { version = "=43.0.3", default-features = false, features = [
    "std", "secp256k1", "portable", "c-kzg", "blst",
    "optional_no_base_fee", "optional_balance_check",
    "optional_block_gas_limit", "optional_eip3607",
    # (workstream C) lets checks skip gas-fee bookkeeping entirely, like a
    # node's eth_call: then the block's coinbase account is never touched, so
    # a check can't come back "unknown" just because we never loaded it.
    "optional_fee_charge",
    # (workstream B) Nitro applies the EIP-7623 calldata floor only when the
    # chain enabled it (off by default); lets arb::configure_cfg turn it off.
    "optional_eip7623",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- workstream A (state mirror, feed, node client, socket server) ---
# Persistent ("copy-on-write") maps: many readers keep using an old version of
# the state while the mirror builds the next one, without copying everything.
imbl = "7"
# Fast hashing for our in-memory maps (keys are addresses / storage slots).
rustc-hash = "2"
# The feed carries transactions as base64 text.
base64 = "0.23"
# Small blocking HTTPS client for the node's JSON-RPC (rustls, no OpenSSL).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# (copy2-n, warm restart) catch SIGTERM / SIGINT so the copy is saved before
# exiting. Already in the build (revm and others use it): nothing new downloaded.
libc = "0.2"
# (fast lane gun, workstream C) the Rust sender. All already in the build
# (revm / ureq use the same versions): nothing new is downloaded.
#   secp256k1: sign our trades (libsecp256k1, RFC 6979, like ethers)
#   rustls + webpki-roots: our own kept-alive HTTPS connection to the send
#     endpoint, so "bytes handed to the socket" can be timed apart from the reply
#   zeroize: wipe key bytes after use
secp256k1 = { version = "=0.31.1", features = ["recovery", "global-context"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
zeroize = "1"
# (Nov 1, memory) mimalloc: the allocator arbsim runs on by default
# (src/alloc.rs, ARBSIM_ALLOC=system = glibc as before). glibc kept freed
# memory and grew ~3 MB a minute live while what the program held stayed
# flat; mimalloc hands empty pages back by itself. Built from C by `cc`
# (already in the build). Pinned: mimalloc 0.1.48 / libmimalloc-sys 0.1.44
# (Aug 2025, mimalloc 2.x).
mimalloc = { version = "=0.1.48", default-features = false, features = ["extended"] }
libmimalloc-sys = { version = "=0.1.44", features = ["extended"] }


[dev-dependencies]
# (secp256k1, used by tests to sign test transactions, is now a normal
# dependency above: the fast lane gun signs with it.)

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

# (workstream B) per-call-frame gas tracer, the counterpart of tools/gas-diff.js:
#   cargo run --release --example gas_trace -- <fixture.json>
[[example]]
name = "gas_trace"
path = "tools/gas_trace.rs"
